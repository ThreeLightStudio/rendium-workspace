name: Bug Report
description: File a bug report to help us improve Rendium Desktop Studio
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: |
        I encountered an error when...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce the issue?
      placeholder: |
        1. Open Rendium Desktop Studio
        2. Import an image
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: |
        The image should be placed on the timeline...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Rendium Desktop Studio are you using?
      placeholder: 0.1.0-beta.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Hardware specs, etc.
      placeholder: macOS 14.5, M1 Max, 32GB RAM
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any error logs from the console (Cmd+Option+I in the app).
